function pl(x,y,c,s){return '<circle cx="'+x+'" cy="'+y+'" r="'+9*s+'" fill="#fff"/><rect x="'+(x-7*s)+'" y="'+(y+7*s)+'" width="'+14*s+'" height="'+12*s+'" rx="'+5*s+'" fill="'+c+'"/>';}
function prev(m){let o='<rect width="400" height="176" fill="#12462f"/>';
  for(let i=0;i<8;i++)o+='<rect x="'+i*50+'" width="25" height="176" fill="rgba(255,255,255,.04)"/>';
  o+='<g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"><line x1="200" y1="0" x2="200" y2="176"/><circle cx="200" cy="82" r="30" stroke="#d8b24a"/><rect x="-2" y="42" width="44" height="80"/><rect x="358" y="42" width="44" height="80"/></g>';
  if(m.k==='m'){const F=m.n===11?F11:m.n===3?F3:F5,sc=m.n===11?.72:m.n===3?1.1:1;
    for(const p of F){o+=pl(p[0],p[1]-6,'#2f56d6',sc)+pl(400-p[0],p[1]-6,'#c8334b',sc);}
    o+=m.lg?'<text x="200" y="96" font-size="42" text-anchor="middle">🏆</text>':'<circle cx="200" cy="82" r="6" fill="#fff"/>';}
  else if(m.k==='shoot'){o+='<rect x="352" y="56" width="40" height="64" fill="none" stroke="#fff" stroke-width="3"/>'+pl(90,70,'#2f56d6',1.2)+'<circle cx="140" cy="108" r="6" fill="#fff"/><path d="M150 106 Q250 60 350 88" fill="none" stroke="#ffd23a" stroke-width="3" stroke-dasharray="6 5"/>';}
  else if(m.k==='gk'){o+='<rect x="352" y="56" width="40" height="64" fill="none" stroke="#fff" stroke-width="3"/>'+pl(330,70,'#e0b51f',1.2)+'<circle cx="110" cy="92" r="6" fill="#fff"/><path d="M120 92 L300 80" fill="none" stroke="#ffd23a" stroke-width="3" stroke-dasharray="6 5"/>';}
  else{o+=pl(90,62,'#2f56d6',1.2)+pl(290,96,'#2f56d6',1.2)+'<path d="M110 70 Q200 20 280 80" fill="none" stroke="#ffd23a" stroke-width="3" stroke-dasharray="6 5"/><circle cx="125" cy="84" r="6" fill="#fff"/>';}
  return o;}
function renderTabs(){$('tabs').innerHTML=TABS.map((t,i)=>'<button class="tb'+(i===tab?' on':'')+'" data-t="'+i+'"><span>'+t[0]+'</span>'+t[1]+'</button>').join('');}
function renderCards(){$('cards').innerHTML=MODES.map((m,i)=>m.tab!==tab?'':'<button class="cd'+(m===cur?' on':'')+(m.soon?' dim':'')+'" data-i="'+i+'">'+(m.n===5&&!m.lg?'<img src="'+IMG5+'" alt="">':'<svg viewBox="0 0 400 176" preserveAspectRatio="xMidYMid slice">'+prev(m)+'</svg>')+'<span class="ck">✓</span>'+(m.soon?'<span class="soon">준비 중</span>':'')+'<div class="ft"><span class="ic">'+m.e+'</span><span class="tt">'+m.t+(m.n?'<i>'+m.n+'v'+m.n+'</i>':'')+'</span><span class="inf">i</span></div></button>').join('');}
function renderInfo(){const m=cur,n=m.n;
  $('pinfo').innerHTML='<div class="bd">'+m.e+'</div><b>'+m.t+'</b><em>'+(n?n+' 대 '+n:'연습')+'</em><p>'+m.d+'</p><div class="kv"><span>시점</span><b style="font-size:14px">'+vname(view)+'</b></div><div class="kv"><span>인원</span><b style="font-size:14px">'+(n?n+' 대 '+n:'혼자')+'</b></div><div class="kv"><span>경기 시간</span><b style="font-size:14px">'+(n===5?'약 3분':n===11?'약 5분':'자유')+'</b></div>';}
function upd(){$('mi').textContent=cur.e;$('mt').textContent=cur.t;$('ms').textContent=(cur.n?cur.n+' 대 '+cur.n:'연습')+' · '+vname(view);}
function openPick(){tab=cur.tab;renderTabs();renderView();renderCards();renderInfo();$('pick').style.display='block';}
function closePick(){$('pick').style.display='none';upd();}
$('mode').onclick=openPick;$('pback').onclick=closePick;$('phome').onclick=closePick;
$('vsel').onclick=e=>{const b=e.target.closest('.vb');if(!b)return;view=b.dataset.v;try{localStorage.setItem('ss_view',view);}catch(e){}renderView();renderInfo();toast(vname(view)+' 모드로 시작해요');};
$('tabs').onclick=e=>{const b=e.target.closest('.tb');if(!b)return;tab=+b.dataset.t;renderTabs();renderCards();};
$('cards').onclick=e=>{const b=e.target.closest('.cd');if(!b)return;const m=MODES[+b.dataset.i];
  if(e.target.closest('.inf')){toast(m.d);return;}
  if(m.soon){toast('3 대 3은 준비 중이에요');return;}
  cur=m;closePick();};   /* 모드를 누르면 바로 홈 화면으로 돌아가요 (킥오프는 홈에서) */
/* 킥오프: 고른 모드로 게임을 이 페이지 안에서 바로 실행해요 (게임은 아래 GAME_B64 에 들어 있어요) */
(function(){try{const sn=localStorage.getItem('ss_nick');if(sn)$('nm').textContent=sn;}catch(e){}})();
function dest(m){if(m.k==='shoot')return 'prac';if(m.k==='gk')return 'gk';if(m.k==='tut')return 'tut';if(m.lg)return 'league';return m.tab===1?'online':'solo';}
let ifr=null,gurl=null;
function closeGame(){if(ifr){ifr.remove();ifr=null;}if(gurl){URL.revokeObjectURL(gurl);gurl=null;}window.__pause=false;}
function launch(m,size){
  closeGame();
  const html=new TextDecoder('utf-8').decode(Uint8Array.from(atob(GAME_B64),c=>c.charCodeAt(0)));
  gurl=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  ifr=document.createElement('iframe');ifr.name='ss_size='+size+';m='+m+';v='+view;
  ifr.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;border:0;z-index:99999;background:#070d1c';
  ifr.setAttribute('allow','fullscreen; autoplay');
  ifr.src=gurl;document.body.appendChild(ifr);window.__pause=true;
  try{history.pushState({g:1},'');}catch(e){}
}
addEventListener('message',e=>{if(e.data&&e.data.starLobby)closeGame();});
addEventListener('popstate',()=>{if(ifr)closeGame();});
$('go').onclick=()=>{if(cur.soon){toast('3 대 3은 준비 중이에요');return;}
  const n=($('nm').textContent||'').replace(/\s+/g,' ').trim().slice(0,10)||'PLAYER';
  try{localStorage.setItem('ss_nick',n);}catch(e){}
  launch(dest(cur),cur.n===11?11:5);};
upd();

function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function goFs(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;
  if(!f||isFs())return;try{const r=f.call(d,{navigationUI:'hide'});if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
function exitFs(){const f=document.exitFullscreen||document.webkitExitFullscreen;if(f&&isFs())try{f.call(document);}catch(e){}}
$('fsBtn').onclick=e=>{e.stopPropagation();isFs()?exitFs():goFs();};
$('go').addEventListener('click',goFs,true);   // 킥오프를 누르면 자동으로 전체화면

  const m1=new THREE.Mesh(geo.limb,m);m1.scale.y=l1;a.add(m1);a.add(new THREE.Mesh(geo.joint,white));
  const b=new THREE.Group();b.position.y=-l1;a.add(b);
  const m2=new THREE.Mesh(geo.limb,m);m2.scale.y=l2;b.add(m2);b.add(new THREE.Mesh(geo.joint,white));
  const e=new THREE.Group();e.position.y=-l2;b.add(e);return{a,b,end:e};}

  const t=new THREE.Mesh(geo.torso,kit);t.position.y=.9;t.scale.y=.58;body.add(t);
  const pel=new THREE.Mesh(geo.joint,white);pel.position.y=.92;pel.scale.setScalar(1.5);body.add(pel);
  const aL=limb(body,kit,.2,1.43,.32,.3),aR=limb(body,kit,-.2,1.43,.32,.3);

  const sh=new THREE.Mesh(geo.joint,white);sh.position.y=1.45;sh.scale.set(4.2,.9,1.4);body.add(sh);

(function(){const lg=$('login'),nick=$('lgnick'),pw=$('lgpw'),pw2=$('lgpw2'),msg=$('lgmsg'),btn=$('lgbtn');
  let auth=null,db=null,who=false,mode='in',busy=false,pending=false;
  const cfgOk=!/^YOUR_/.test(FIREBASE_CONFIG.apiKey)&&window.firebase;
  function say(t){msg.textContent=t||'';}
  function enter(name){who=true;$('nm').textContent=String(name).trim().slice(0,10)||'PLAYER';lg.style.display='none';nick.value=pw.value=pw2.value='';say('');}
  // 닉네임 → 키 (한글도 되도록 UTF-8 16진수로, 대소문자는 같은 닉네임으로 취급)
  function toKey(n){return Array.from(new TextEncoder().encode(n.normalize('NFC').toLowerCase()),x=>x.toString(16).padStart(2,'0')).join('');}
  const toEmail=n=>'u'+toKey(n)+'@starsoccer.game';
  function setMode(m){mode=m;say('');const nm=m==='nick';
    document.querySelectorAll('#lgtabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    $('lgtabs').style.display=nm?'none':'flex';$('lghead').style.display=nm?'block':'none';$('lgback').style.display=nm?'block':'none';
    pw.style.display=nm?'none':'block';pw2.style.display=m==='up'?'block':'none';
    $('lgor').style.display=$('lggoogle').style.display=m==='in'?'':'none';
    btn.textContent={in:'로그인',up:'가입하기',nick:'시작하기'}[m];
    pw.autocomplete=m==='up'?'new-password':'current-password';}
  $('lgtabs').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);};
  const ERR={'auth/email-already-in-use':'이미 사용 중인 닉네임이에요','nick-taken':'이미 사용 중인 닉네임이에요',
    'auth/invalid-credential':'닉네임 또는 비밀번호가 맞지 않아요','auth/wrong-password':'닉네임 또는 비밀번호가 맞지 않아요',
    'auth/user-not-found':'가입되지 않은 닉네임이에요. 회원가입을 해 주세요','auth/invalid-login-credentials':'닉네임 또는 비밀번호가 맞지 않아요',
    'auth/weak-password':'비밀번호는 6자 이상이어야 해요','auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 해 주세요',
    'auth/network-request-failed':'인터넷 연결을 확인해 주세요','auth/operation-not-allowed':'Firebase에서 이 로그인 방식을 켜 주세요',
    'auth/unauthorized-domain':'Firebase 승인된 도메인에 이 주소를 추가해 주세요',
    'permission-denied':'Firestore 보안 규칙을 먼저 설정해 주세요','not-found':'Firestore 데이터베이스를 먼저 만들어 주세요',
    'failed-precondition':'Firestore 데이터베이스를 먼저 만들어 주세요','unavailable':'연결에 실패했어요. 인터넷과 Firestore 설정을 확인해 주세요'};
  const errText=e=>ERR[e.code]||('오류: '+(e.code||e.message));
  // 닉네임 등록: 이미 쓰는 닉네임이면 실패 (한 번에 처리해서 동시에 가입해도 겹치지 않음)
  async function claim(u,n){const ref=db.collection('nicknames').doc(toKey(n));
    await db.runTransaction(async t=>{const d=await t.get(ref);if(d.exists)throw{code:'nick-taken'};
      t.set(ref,{uid:u.uid,nick:n});t.set(db.collection('users').doc(u.uid),{nick:n});});}
  async function nickOf(u){const d=await db.collection('users').doc(u.uid).get();return d.exists?d.data().nick:null;}
  async function submit(){
    if(busy)return;
    if(!auth){say(window.firebase?'FIREBASE_CONFIG를 먼저 설정해 주세요':'Firebase를 불러오지 못했어요. 인터넷에 올린 주소에서 열어 주세요');return;}
    const n=nick.value.trim();
    if(!/^[0-9A-Za-z가-힣_]{2,10}$/.test(n)){say('닉네임은 한글·영문·숫자·_ 2~10자로 입력해 주세요');return;}
    if(mode==='nick'){busy=true;btn.disabled=true;say('');
      try{const u=auth.currentUser;if(!u)throw{code:'auth/user-not-found'};await claim(u,n);
        try{await u.updateProfile({displayName:n});}catch(_){}enter(n);}
      catch(e){say(errText(e));}
      busy=false;btn.disabled=false;return;}
    const p=pw.value;
    if(p.length<6){say('비밀번호는 6자 이상이어야 해요');return;}
    if(mode==='up'&&p!==pw2.value){say('비밀번호 확인이 달라요');return;}
    busy=true;pending=true;btn.disabled=true;say('');
    try{
      if(mode==='up'){const c=await auth.createUserWithEmailAndPassword(toEmail(n),p);
        try{await claim(c.user,n);}catch(e){try{await c.user.delete();}catch(_){}throw e;}
        try{await c.user.updateProfile({displayName:n});}catch(_){}enter(n);}
      else{const c=await auth.signInWithEmailAndPassword(toEmail(n),p);
        let nk=null;try{nk=await nickOf(c.user);}catch(_){}enter(nk||c.user.displayName||n);}
    }catch(e){say(errText(e));}
    pending=false;busy=false;btn.disabled=false;}
  btn.onclick=submit;
  [nick,pw,pw2].forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
  $('lggoogle').onclick=async()=>{
    if(!auth){say(window.firebase?'FIREBASE_CONFIG를 먼저 설정해 주세요':'Firebase를 불러오지 못했어요. 인터넷에 올린 주소에서 열어 주세요');return;}
    const pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
    const gb=$('lggoogle');if(gb.disabled)return;gb.disabled=true;say('구글 로그인 창을 여는 중...');
    try{await auth.signInWithPopup(pv);say('로그인 확인 중...');}
    catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
        say('구글 화면으로 이동해요...');
        try{await auth.signInWithRedirect(pv);}catch(e2){say(errText(e2));}
      }
      else if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')say('로그인이 취소됐어요. 다시 눌러 주세요');
      else say(errText(e));
    }
    gb.disabled=false;};
  $('lgback').onclick=()=>{if(auth)auth.signOut();setMode('in');};
  if(cfgOk){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.getRedirectResult().catch(e=>say(errText(e)));
    auth.onAuthStateChanged(async u=>{
      if(!u||pending)return;
      let nk=null,err=null;try{nk=await nickOf(u);}catch(e){err=e;}
      if(nk)enter(nk);
      else if(u.providerData.some(p=>p.providerId==='password')&&u.displayName)enter(u.displayName);
      else{lg.style.display='flex';setMode('nick');if(err)say(errText(err));}});}
  $('gear').onclick=()=>{if(!who){toast('설정');return;}
    if(confirm('로그아웃할까요?')){if(auth)auth.signOut();who=false;lg.style.display='flex';setMode('in');}};
})();
</script>
